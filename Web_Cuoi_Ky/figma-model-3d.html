<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEPHYRON · Corvette C7 3D</title>
<script type="module" src="assets/vendor/model-viewer/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0e11;color:#f2f0ec;font:15px/1.6 system-ui,sans-serif}header,footer,.controls{padding:20px max(20px,5vw)}header{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #303238}h1{font-size:18px;margin:0}header span,footer{color:#aeb2b8}model-viewer{display:block;width:100%;height:68vh;min-height:300px;background:#0b0e11}button,a{color:inherit}button{border:1px solid #45484d;background:transparent;padding:11px 18px;font:inherit;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#f33640;background:#261115}.controls{display:flex;gap:10px;flex-wrap:wrap}.status{padding:0 5vw}footer{font-size:12px}body.capture header,body.capture .controls,body.capture footer,body.capture .status{display:none}body.capture model-viewer{width:1280px;height:720px;min-height:0}@media(max-width:600px){header{flex-direction:column}model-viewer{height:52vh}.controls{padding:16px;gap:8px}button{flex:1 1 40%}}</style><link rel="stylesheet" href="monochrome.css">
</head>
<body><header><h1>ZEPHYRON / CORVETTE C7</h1><span>Kéo để xoay · Cuộn hoặc chụm để thu phóng</span></header>
<model-viewer src="assets/model/corvette-c7.glb" alt="Model 3D Corvette C7, kéo để xoay tự do" camera-controls camera-orbit="42deg 76deg 105%" field-of-view="30deg" shadow-intensity="1.15" shadow-softness="1" environment-image="assets/model/studio-softbox.hdr" exposure="1.05" interaction-prompt="none" interpolation-decay="65" loading="eager"></model-viewer>
<p class="status" role="status">Đang tải model 3D…</p><div class="controls"><button data-angle="0">Chính diện</button><button data-angle="42">Góc nghiêng</button><button data-angle="90">Ngang thân</button><button data-angle="180">Phía sau</button><button id="spin" aria-pressed="false">Tự xoay</button><button id="reset">Đặt lại</button></div>
<footer>Model: Martin Trafas · <a href="https://sketchfab.com/3d-models/chevrolet-corvette-c7-2b509d1bce104224b147c81757f6f43a">Chevrolet Corvette C7</a> · CC BY 4.0. Bản GLB đã chỉnh vật liệu cho ZEPHYRON.</footer>
<script type="module">const v=document.querySelector('model-viewer'),s=document.querySelector('.status'),spin=document.querySelector('#spin');if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');v.addEventListener('load',()=>{v.model.materials.filter(m=>m.name==='Car Paint').forEach(m=>m.pbrMetallicRoughness.setBaseColorFactor('#111216'));s.textContent='Model sẵn sàng · Kéo để khám phá mọi góc nhìn';window.modelReady=true});v.addEventListener('error',()=>{s.textContent='Chưa tải được model. Kiểm tra máy chủ local và tải lại trang.'});document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{v.autoRotate=false;spin.setAttribute('aria-pressed','false');v.cameraOrbit=`${b.dataset.angle}deg 76deg 105%`});spin.onclick=()=>{v.autoRotate=!v.autoRotate;spin.setAttribute('aria-pressed',String(v.autoRotate))};document.querySelector('#reset').onclick=()=>{v.autoRotate=false;spin.setAttribute('aria-pressed','false');v.cameraOrbit='42deg 76deg 105%';v.fieldOfView='30deg'};</script></body></html>
