<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bộ sưu tập ZEPHYRON. Năm mẫu xe, một cuộn phim tương tác.">
<title>Bộ sưu tập — ZEPHYRON</title>
<link rel="icon" href="assets/brand-monochrome/zephyron-symbol.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="monochrome.css">
<link rel="stylesheet" href="navigation.css">
<script type="module" src="site.js"></script>
<style>
  body {
    --bg:#000; --fg:#f4f2ee; --mute:#6f6d69; --line:rgba(244,242,238,.16); --red:#ff2b2b;
    --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
    --pad:max(16px,1.6vw); --gallery:46vw; --thumb:5.2vw; --digit:2.5vw;
    --roll-step:7.9vw; --index-step:4.6vw; --index-size:4.3vw; --reel-bottom:0px;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#000 }
  body { background:var(--bg); color:var(--fg); font-family:Inter,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; transition:background .6s }
  body.light { --bg:#f3f2ef; --fg:#0c0c0c; --mute:#9a9893; --line:rgba(12,12,12,.14) }
  button,a { color:inherit; font:inherit }
  button { border:0; background:none; cursor:pointer; letter-spacing:inherit; text-transform:inherit }
  a { text-decoration:none }
  button:focus-visible,a:focus-visible { outline:2px solid var(--red); outline-offset:4px }
  .ui { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase }
  .big { font-family:Anton,Impact,"Arial Narrow",sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:-.005em; line-height:.9 }
  .sr { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
  .dots { display:grid; grid-template-columns:repeat(2,3px); gap:3px }
  .dots i { width:3px; height:3px; background:currentColor; border-radius:50% }
  #tools { position:fixed; z-index:20; top:102px; right:var(--pad); display:flex; align-items:center; gap:12px }
  .ico { display:grid; place-items:center; width:26px; height:26px; border:1px solid var(--line); border-radius:50% }
  .ico svg { width:12px; height:12px }
  .edition { opacity:.6 }
  #gl,#flat { position:fixed; inset:0; width:100%; height:100%; z-index:1 }
  #gl { touch-action:none; opacity:0 }
  #gl.ready { opacity:1 }
  #flat { pointer-events:none; overflow:hidden }
  #flat[hidden] { display:none }
  #flat img { position:absolute; left:50%; top:45.5%; height:var(--flat-h,49vh); width:var(--flat-w,87vh); object-fit:cover }
  #home { position:fixed; inset:0; z-index:5; pointer-events:none; transition:opacity .4s }
  .index #home { opacity:0 }
  #roll { position:absolute; left:1.3vw; bottom:calc(2.2vh + var(--reel-bottom)); height:var(--roll-step); overflow:hidden }
  #roll .slide { transition:transform .55s var(--ease) .1s }
  #roll .list { transition:transform 1s var(--ease) }
  #roll .big { display:block; font-size:8.6vw; height:var(--roll-step); line-height:var(--roll-step); white-space:nowrap }
  .out #roll .slide { transform:translateY(calc(var(--roll-step) + .5vw)); transition:transform .5s var(--ease) }
  .out #roll .list > :not(.cur) { visibility:hidden }
  #nx { position:absolute; right:var(--pad); bottom:calc(2.4vh + var(--reel-bottom)); display:flex; flex-direction:column; align-items:flex-end; gap:8px; transition:transform .55s var(--ease) .1s }
  .out #nx { transform:translateY(calc(100% + 4vh + var(--reel-bottom))); transition:transform .5s var(--ease); pointer-events:none }
  #nx .lab { text-align:right; line-height:1.35 }
  #nx .lab > span { display:block; opacity:.55; font-size:8px }
  #nx .lab b { display:block; height:13px; overflow:hidden; font-weight:500 }
  #nx .lab i { display:block; font-style:normal; transition:transform .7s var(--ease) }
  #openCase:focus-visible { width:max-content; height:auto; padding:8px; right:0; bottom:100%; clip-path:none; background:var(--bg); pointer-events:auto }
  .rb { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; color:var(--bg); background:var(--fg); pointer-events:auto; transition:transform .25s var(--out) }
  .rb:hover { transform:scale(1.15) }
  .rb svg { width:10px; height:10px }
  #cur { position:fixed; left:0; top:0; z-index:100; pointer-events:none; display:none; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:var(--red) }
  #cur b { position:absolute; left:14px; top:-4px; white-space:nowrap; font-size:9px; font-weight:500; letter-spacing:.08em; color:var(--fg); text-shadow:0 0 4px var(--bg); opacity:0; transition:opacity .25s }
  #cur.lab b { opacity:1 }
  @media (hover:hover) and (pointer:fine) {
    body.pointer,body.pointer * { cursor:none }
    body.pointer #cur { display:block }
  }
  #case { position:fixed; inset:0; z-index:10; background:var(--bg); clip-path:inset(0 0 100% 0); pointer-events:none; transition:clip-path .8s var(--ease),background .6s }
  .case #case { clip-path:inset(0); pointer-events:auto }
  .instant #case { transition:none }
  #back,#film,#more,#rail { position:absolute; opacity:0; transition:opacity 0s .8s }
  #back { left:var(--pad); top:19vh }
  #film { left:var(--pad); bottom:calc(2.6vh + var(--reel-bottom)); display:flex; gap:6px; align-items:center; font-size:8px }
  #film i { width:5px; height:5px; background:var(--red); border-radius:50% }
  #more { right:var(--pad); bottom:calc(2.2vh + var(--reel-bottom)); display:flex; align-items:center; gap:7px; font-size:12px }
  .case #back { opacity:.6; transition:opacity .5s .85s }
  .case :is(#film,#more,#rail) { opacity:1; transition:opacity .5s .95s,transform .9s var(--ease) }
  #ctitle { position:absolute; left:var(--pad); top:50%; width:20vw; transform:translateY(-50%); font-size:3.4vw }
  #ctitle .ln,#ctitle .ln span { display:block }
  #ctitle .ln { overflow:hidden }
  #ctitle .ln span { transform:translateY(105%); transition:transform 0s .8s }
  .case #ctitle .ln span { transform:none; transition:transform .8s var(--out) .62s }
  .case #ctitle .ln + .ln span { transition-delay:.72s }
  #gal { position:absolute; left:50%; top:0; width:var(--gallery); height:100%; margin-left:calc(var(--gallery) / -2); transform:translateY(22vh); transition:transform 0s .8s; touch-action:none }
  .case #gal { transform:none; transition:transform 1.25s var(--out) .1s }
  .fr { position:absolute; display:block; left:0; top:50%; width:100%; aspect-ratio:16/9; background-position:center; background-size:cover; transition:transform 1s var(--ease),filter 1s var(--ease) }
  .fr video { display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none }
  .fr.off { filter:blur(16px) brightness(.42) }
  .light .fr.off { filter:blur(16px) brightness(1.05) saturate(.6) opacity(.55) }
  #player { position:absolute; left:0; right:0; bottom:-30px; min-height:22px; display:flex; align-items:center; gap:8px; opacity:0; transition:opacity 0s .8s }
  .case #player:not([hidden]) { opacity:1; transition:opacity .5s 1s }
  #player[hidden] { display:none }
  #player i { flex:1; height:1px; background:var(--line) }
  #cnt { position:absolute; left:88.6vw; top:50%; transform:translateY(-55%); font-size:var(--digit); line-height:1; clip-path:inset(100% 0 0); transition:clip-path 0s .8s }
  .case #cnt { clip-path:inset(0); transition:clip-path .8s var(--out) .7s }
  .digits { height:var(--digit); overflow:hidden }
  #count { transition:transform .9s var(--ease) }
  #count span { display:block; height:var(--digit) }
  #cnt small { display:block; margin-top:.35vw; color:var(--mute); font-size:inherit }
  #rail { right:-1.4vw; top:50%; display:flex; flex-direction:column; gap:6px }
  #rail button { width:var(--thumb); aspect-ratio:16/9; background-position:center; background-size:cover; filter:brightness(.4); transition:filter .5s,transform .5s var(--out) }
  #rail .on { filter:none; transform:translateX(-.8vw) }
  #card { position:absolute; z-index:3; right:.6vw; top:13vh; bottom:11vh; width:max(21.5vw,250px); padding:18px 18px 16px; display:flex; flex-direction:column; background:#fff; color:#0c0c0c; transform:translateX(calc(100% + 2vw)); transition:transform .8s var(--ease); user-select:text }
  .read #card { transform:none }
  #card .tx { flex:1; overflow:auto; scrollbar-width:thin; padding-right:6px; overscroll-behavior:contain }
  #card .cat,#card h4,#card .stat span { font-size:8px; letter-spacing:.1em; text-transform:uppercase; opacity:.7 }
  #card h3 { font-size:clamp(26px,1.9vw,44px); margin:6px 0 }
  #card .redbar { width:40%; height:7px; margin-bottom:8px; background:var(--red) }
  #card .meta { font-size:10px; line-height:1.5; opacity:.7; margin-bottom:12px }
  #card .lead { font-size:13px; line-height:1.45; margin-bottom:16px }
  #card h4 { margin:10px 0 6px; font-weight:500 }
  #card .copy { font-size:11px; line-height:1.6; opacity:.8 }
  #card .stat { display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid #e3e3e3; padding-top:10px; margin-top:10px }
  #card .stat span { display:block; margin-bottom:4px }
  #card .stat b { font-size:clamp(23px,2.3vw,36px) }
  #cardX { width:32px; height:32px; display:grid; place-items:center }
  #idx { position:fixed; inset:0; z-index:60; background:#121212; color:#f4f2ee; clip-path:inset(0 0 100% 0); transition:clip-path .9s var(--ease); touch-action:none }
  .index #idx { clip-path:inset(0) }
  #xclose { position:absolute; left:var(--pad); top:10px; z-index:2; width:36px; height:36px; display:grid; place-items:center }
  #xclose .dots { grid-template-columns:repeat(3,3px); transform:rotate(45deg) }
  #hair { position:absolute; top:50%; width:100%; height:1px; background:rgba(255,43,43,.55) }
  #ithumb { position:absolute; left:var(--pad); top:50%; width:10.5vw; aspect-ratio:16/9; transform:translateY(-50%); object-fit:cover }
  #imeta { position:absolute; left:25vw; top:50%; transform:translateY(-120%); font-size:8px; line-height:1.4; opacity:.55 }
  #ilist { position:absolute; inset:0 0 0 33vw }
  #ilist button { position:absolute; left:0; height:var(--index-step); white-space:nowrap; font-size:var(--index-size); line-height:1; color:#3a3a3a; transition:color .35s }
  #ilist span { display:block; transform:skewX(-11deg); transition:transform .5s var(--out) }
  #ilist .on,#ilist button:focus-visible { color:#f4f2ee }
  #ilist .on span { transform:skewX(-11deg) translateX(2.2vw) }
  .no-script { position:fixed; inset:40% var(--pad) auto; text-align:center }
  @media (max-width:760px) {
    body { --gallery:68vw; --thumb:9vw; --digit:clamp(16px,3.8vw,26px); --roll-step:clamp(44px,10.2vw,76px); --index-step:clamp(36px,7vw,54px); --index-size:clamp(29px,6.7vw,49px); --reel-bottom:var(--bottom-nav-height,64px) }
    .edition { display:none }
    #tools { top:86px; gap:8px }
    .ico,.rb { width:36px; height:36px }
    #roll { left:var(--pad); bottom:calc(4vh + var(--reel-bottom)); max-width:calc(100vw - 60px) }
    #roll .big { font-size:clamp(31px,9.5vw,69px) }
    #nx { bottom:calc(3.6vh + var(--reel-bottom)); gap:6px }
    #nx .lab { max-width:120px }
    #nx .lab b { font-size:8px }
    #back { top:max(13vh,82px); min-height:40px }
    #ctitle { top:23vh; width:80vw; font-size:clamp(28px,6vw,45px) }
    #cnt { left:auto; right:10vw }
    #card { top:max(13vh,82px); bottom:max(11vh,calc(var(--reel-bottom) + 16px)); right:var(--pad); width:min(370px,calc(100% - 2 * var(--pad))); transform:translateX(calc(100% + 2 * var(--pad))) }
    #ithumb { width:20vw }
    #imeta { left:var(--pad); top:calc(50% - 6vw); max-width:22vw }
    #ilist { left:27vw }
    #more,#film { min-height:42px }
  }
  @media (max-height:550px) and (orientation:landscape) {
    #ctitle { top:50%; width:20vw; font-size:3.4vw }
    #card { top:94px; bottom:calc(52px + var(--reel-bottom)) }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { transition-duration:0s!important; transition-delay:0s!important }
  }
</style>
</head>
<body>
<div data-site-header></div>
<main id="main-content">
  <h1 class="sr">Bộ sưu tập ZEPHYRON</h1>
  <div class="ui" id="tools" role="group" aria-label="Điều khiển cuộn phim">
    <span class="edition">Showreel / 05</span>
    <button class="ico" id="theme" aria-label="Chế độ sáng" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button class="ico" id="openIndex" aria-label="Danh sách xe" aria-controls="idx"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
  </div>
  <div id="flat" aria-hidden="true"><img src="assets/unveil-five/corvette-poster.webp" alt=""></div>
  <canvas id="gl" aria-label="Cuộn phim xe. Kéo ngang để đổi xe, bấm giữa màn hình để xem chi tiết."></canvas>
  <section id="home" aria-label="Cuộn phim">
    <p id="currentName" class="sr" aria-live="polite">Corvette C7</p>
    <div id="roll" aria-hidden="true"><div class="slide"><div class="list"></div></div></div>
    <div id="nx" class="ui">
      <div class="lab" aria-hidden="true"><span>Tiếp theo</span><b><i></i></b></div>
      <button id="bNext" class="rb" aria-label="Xe tiếp theo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 8 7-8 7" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
      <button id="bPrev" class="rb" aria-label="Xe trước"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5-8 7 8 7" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
      <button id="openCase" class="sr">Xem chi tiết xe đang chọn</button>
    </div>
  </section>
  <section id="case" aria-labelledby="ctitle" inert>
    <button id="back" class="ui">Quay lại</button>
    <h2 id="ctitle" class="big"></h2>
    <div id="gal" aria-label="Các góc nhìn"></div>
    <div id="cnt" class="big" aria-hidden="true"><div class="digits"><div id="count"></div></div><small>08</small></div>
    <div id="rail" aria-label="Chọn khung hình"></div>
    <a id="film" class="ui" href="films.html">Xem phim <i aria-hidden="true"></i></a>
    <button id="more" aria-controls="card" aria-expanded="false">Đọc thêm <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
    <aside id="card" aria-labelledby="card-title" inert>
      <div class="tx"></div>
      <div class="stat"><div id="stat"></div><button id="cardX" aria-label="Đóng phần đọc thêm"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></div>
    </aside>
  </section>
  <section id="idx" role="dialog" aria-modal="true" aria-label="Danh sách xe" inert>
    <button id="xclose" aria-label="Đóng danh sách"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
    <div id="hair" aria-hidden="true"></div>
    <img id="ithumb" alt="">
    <p id="imeta" class="ui" aria-hidden="true"></p>
    <div id="ilist" class="big"></div>
  </section>
  <noscript><div class="no-script"><p>Bật JavaScript để xem cuộn phim.</p><a href="products.html">Mở studio 3D</a></div></noscript>
</main>
<div id="cur" aria-hidden="true"><b>Xem chi tiết</b></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const body = document.body;
  const canvas = $('gl');
  const headerMount = document.querySelector('[data-site-header]');
  const siteNavigation = '.site-header,.bottom-nav,.nav-search';
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const compact = matchMedia('(max-width:760px)');
  const cars = [
    {id:'corvette', title:'Corvette C7', brand:'Chevrolet', type:'Coupé thể thao', series:'C7',
      lead:'Dáng thấp, vai rộng và những đường gân dứt khoát. Một dấu ấn đậm chất Mỹ.',
      detail:'Nhìn gần bộ mâm đen, cùm phanh vàng và nếp gấp nổi trên thân xe.'},
    {id:'bmw', title:'BMW M4', brand:'BMW', type:'Coupé thể thao', series:'G82',
      lead:'Tỉ lệ coupé thể thao cùng lưới tản nhiệt kép đặc trưng. Cá tính hiện diện từ mọi góc nhìn.',
      detail:'Góc chính diện làm rõ lưới tản nhiệt và cụm đèn. Góc ngang cho thấy đường mui liền mạch.'},
    {id:'porsche', title:'Porsche 911 GT3', brand:'Porsche', type:'Coupé thể thao', series:'992',
      lead:'Đường cong quen thuộc của 911, kết hợp tinh thần đường đua và cánh gió nổi bật.',
      detail:'Góc sau nhấn vào cánh gió và dải đèn hậu. Dáng xe thấp hiện rõ ở góc ngang.'},
    {id:'mercedes', title:'AMG SL63', brand:'Mercedes-Benz', type:'Roadster', series:'SL63',
      lead:'Mui trần thanh lịch, nội thất sáng và những chi tiết AMG. Thể thao theo cách riêng.',
      detail:'Đường mui mở và nắp ca-pô dài tạo nên dáng roadster. Góc sau cho thấy bề ngang của xe.'},
    {id:'lamborghini', title:'Revuelto', brand:'Lamborghini', type:'Siêu xe hybrid', series:'V12',
      lead:'Đường nét góc cạnh, dáng nêm thấp và chữ ký ánh sáng khác biệt.',
      detail:'Cụm đèn chữ Y và các mặt cắt sắc nét nổi bật khi quan sát từ góc nghiêng.'}
  ];
  const tiles = [];
  for (const [project, car] of cars.entries()) {
    car.start = tiles.length;
    if (project === 0) tiles.push({src:'assets/unveil-five/corvette-poster.webp', label:'Phim Corvette C7', project});
    for (const [angle, label] of [['hero','Góc nghiêng'], ['side','Ngang thân xe'], ['rear','Phía sau']]) {
      tiles.push({src:'assets/gallery-real-v1/' + car.id + '-' + angle + '-real-v1.webp', label, project});
    }
  }
  const count = cars.length;
  const total = tiles.length;
  const mod = (value, length) => ((value % length) + length) % length;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const pad = n => String(n).padStart(2,'0');
  const clip = car => 'assets/unveil-five/' + car.id + '.mp4';
  const wrapNear = (center, ref) => center + Math.round((ref - center) / total) * total;
  const center = i => cars[i].start + .5;
  const requested = new URLSearchParams(location.search).get('car');
  let current = Math.max(0, cars.findIndex(car => car.id === requested));
  let pos = center(current);
  let target = pos;
  let width, height, halfHeight, tileWidth, crop;
  let mode = 'home';
  let gestureCenter = null, lastInput = 0, drag = null;
  let rollIndex = count + current, rollTimer, nextTimer;
  let caseIndex = current, frameIndex = 0, caseVideo = null, galleryLock = 0, galleryTouch = null;
  let indexValue = current, indexTarget = current, indexProject = -1, previousMode, indexTrigger, indexDrag;
  let pointer = null;

  const dots = $('cur');
  const flat = $('flat');
  const flatTiles = [new Image(), new Image(), flat.firstElementChild, new Image(), new Image()];
  flat.replaceChildren(...flatTiles);
  const rollList = document.querySelector('#roll .list');
  const nextLabel = document.querySelector('#nx .lab i');
  const list = $('ilist');
  const rollLines = [], indexItems = [];
  for (let k = 0; k < count * 3; k++) {
    const i = k % count;
    const line = document.createElement('span');
    line.className = 'big';
    line.textContent = cars[i].title;
    rollLines.push(rollList.appendChild(line));
    const item = document.createElement('button');
    item.type = 'button';
    item.dataset.i = i;
    item.tabIndex = -1;
    const label = document.createElement('span');
    label.textContent = cars[i].title;
    item.append(label);
    indexItems.push(list.appendChild(item));
  }

  function setRoll(i, direction, instant = false) {
    const middle = count + i;
    let next = middle;
    if (direction > 0 && next < rollIndex) next += count;
    if (direction < 0 && next > rollIndex) next -= count;
    clearTimeout(rollTimer);
    function place(at, snap) {
      rollIndex = at;
      rollList.style.transition = snap ? 'none' : '';
      rollList.style.transform = 'translateY(calc(' + -at + ' * var(--roll-step)))';
      rollLines.forEach((line,k) => line.classList.toggle('cur', k === at));
      if (snap) {
        void rollList.offsetHeight;
        rollList.style.transition = '';
      }
    }
    place(instant || motion.matches ? middle : next, instant || motion.matches);
    rollTimer = setTimeout(() => {
      if (rollIndex !== middle) place(middle, true);
    }, 1050);
    $('currentName').textContent = cars[i].title;

  function initGL() {
    const gl = canvas.getContext('webgl2',{antialias:false,premultipliedAlpha:false,alpha:false});
    if (!gl) return null;
    const vertex = `#version 300 es
      in vec2 point;
      void main() { gl_Position = vec4(point,0.0,1.0); }`;
    const fragment = `#version 300 es
      precision highp float;
      out vec4 pixel;
      uniform sampler2D sheet, film;
      uniform vec4 cells[16];
      uniform vec2 res;
      uniform vec3 bg;
      uniform float pos, halfH, cy, tileW, crop, videoOn;
      vec3 sampleTile(float s, float v) {
        int id = int(mod(floor(s),16.0));
        vec2 uv = vec2(0.5 + (fract(s)-0.5)*crop, v);
        if (id == 0 && videoOn > 0.5) return texture(film,uv).rgb;
        vec4 cell = cells[id];
        return texture(sheet,cell.xy + uv*cell.zw).rgb;
      }
      void main() {
        vec2 fc = vec2(gl_FragCoord.x,res.y-gl_FragCoord.y);
        float x = (fc.x-res.x*0.5)/(res.x*0.5);
        float ax = abs(x);
        float tT = tan(0.95);
        float theta = atan(x*tT);
        float s = pos + (theta/tT)*res.x*0.5/tileW;
        float v = (fc.y-cy)/(2.0*halfH/cos(theta))+0.5;
        if (v <= 0.0 || v >= 1.0) { pixel = vec4(bg,1.0); return; }
        float feather = 0.006 + ax*ax*0.16;
        float mask = smoothstep(0.0,feather,v)*smoothstep(0.0,feather,1.0-v);
        float r = pow(ax,2.4)*0.06;
        vec3 color = vec3(0.0);
        for (int k=-4;k<=4;k++) {
          float o = float(k)/4.0;
          color += sampleTile(s+o*r,clamp(v+o*r*0.6,0.0,1.0));
        }
        color *= mix(1.0,0.55,ax*ax)/9.0;
        pixel = vec4(mix(bg,color,mask),1.0);
      }`;
    function compile(type, code) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader,code);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    const program = gl.createProgram();
    gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
    gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const point = gl.getAttribLocation(program,'point');
    gl.enableVertexAttribArray(point);
    gl.vertexAttribPointer(point,2,gl.FLOAT,false,0,0);
    const uniforms = Object.fromEntries(['sheet','film','cells[0]','res','bg','pos','halfH','cy','tileW','crop','videoOn']
      .map(name => [name,gl.getUniformLocation(program,name)]));
    function makeTexture(unit) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,texture);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    }
    makeTexture(0);
    makeTexture(1);
    gl.uniform1i(uniforms.sheet,0);
    gl.uniform1i(uniforms.film,1);
    const cellWidth = 960, cellHeight = 540;
    const rects = tiles.flatMap((_,i) => [
      (i % 4 * cellWidth + 2) / 3840, (Math.floor(i/4) * cellHeight + 2) / 2160,
      (cellWidth - 4) / 3840, (cellHeight - 4) / 2160
    ]);
    gl.uniform4fv(uniforms['cells[0]'],new Float32Array(rects));

    let ready = false;
    let lastVideoTime = -1;
    const bg = [0,0,0];
    // Pack the gallery's original photos once so the fragment shader can sample one texture.
    Promise.all(tiles.map(tile => {
      const img = new Image();
      img.src = tile.src;
      return img.decode().then(() => img);
    })).then(images => {
      if (gl.isContextLost()) return;
      const atlas = document.createElement('canvas');
      atlas.width = 3840;
      atlas.height = 2160;
      const ctx = atlas.getContext('2d',{alpha:false});
      images.forEach((img,i) => {
        const scale = Math.max(cellWidth/img.naturalWidth,cellHeight/img.naturalHeight);
        const sw = cellWidth / scale, sh = cellHeight / scale;
        ctx.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,
          i % 4 * cellWidth,Math.floor(i/4) * cellHeight,cellWidth,cellHeight);
      });
      gl.activeTexture(gl.TEXTURE0);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,atlas);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      ready = gl.getError() === gl.NO_ERROR;
      if (ready) {
        canvas.classList.add('ready');
        flat.hidden = true;
      }
    }).catch(() => {});

    return dt => {
      if (!ready || gl.isContextLost()) return false;
      const light = body.classList.contains('light');
      const rgb = light ? [243/255,242/255,239/255] : [0,0,0];
      for (let i=0;i<3;i++) bg[i] += (rgb[i]-bg[i])*(motion.matches ? 1 : Math.min(1,dt*5));

      }
      const scale = canvas.width / width;
      gl.viewport(0,0,canvas.width,canvas.height);
      gl.uniform2f(uniforms.res,canvas.width,canvas.height);
      gl.uniform3fv(uniforms.bg,bg);
      gl.uniform1f(uniforms.pos,pos);
      gl.uniform1f(uniforms.halfH,halfHeight*scale);
      gl.uniform1f(uniforms.cy,canvas.height*.455);
      gl.uniform1f(uniforms.tileW,tileWidth*scale);
      gl.uniform1f(uniforms.crop,crop);
      gl.uniform1f(uniforms.videoOn,Number(videoOn));
      gl.drawArrays(gl.TRIANGLES,0,3);
      return true;
    };
  }

      else if (!read && (down || up)) setFrame(frameIndex+(down ? 1 : -1));
      else return;
    } else if (mode === 'index') {
      if (key === 'Escape') closeIndex();
      else if (down || up) indexTarget += down ? 1 : -1;
      else if (key === 'Enter') closeIndex(Number(event.target.dataset?.i ?? indexProject));
      else return;
    } else return;
    event.preventDefault();
  });

  function resize() {
    width = innerWidth;
    height = innerHeight;
    const dpr = Math.min(devicePixelRatio,1.5);
    canvas.width = Math.round(width*dpr);
    canvas.height = Math.round(height*dpr);
    halfHeight = compact.matches ? Math.min(height*.245,width*.235) : height*.245;
    const fullTile = halfHeight*2*16/9;
    tileWidth = compact.matches ? Math.min(fullTile,width*.62) : fullTile;
    crop = tileWidth/fullTile;
    flat.style.setProperty('--flat-h',halfHeight*2+'px');
    flat.style.setProperty('--flat-w',tileWidth+'px');
    layoutCase();
  }
  window.addEventListener('resize',resize);
  motion.addEventListener('change',() => {
    if (motion.matches) reelVideo.pause();
    else reelVideo.play().catch(() => {});
  });
  resize();
  setRoll(current,1,true);
  setNext(current,true);
  let lastTime = performance.now();
  function tick(now) {
    const dt = clamp((now-lastTime)/1000,0,.05);
    lastTime = now;
    if (mode === 'home' && !drag && gestureCenter !== null && now-lastInput>380) {
      target = settle(target);
      gestureCenter = null;
    }
    pos += (target-pos)*(motion.matches ? 1 : 1-Math.exp(-5.5*dt));
    const active = tiles[mod(Math.floor(pos),total)].project;
    if (active !== current) {
      const direction = Math.sign(target-pos) || (mod(active-current,count)<=count/2 ? 1 : -1);
      current = active;
      setRoll(active,direction);
      setNext(active);
    }
    if (!drawGL?.(dt)) drawFlat();
    if (mode === 'index') drawIndex();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
