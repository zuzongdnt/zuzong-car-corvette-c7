<section id="intro" class="campaign" aria-labelledby="campaign-brand">
  <div class="campaign-media" aria-hidden="true">
    <img class="campaign-poster" alt="" decoding="async">
    <video class="campaign-video" autoplay muted loop playsinline preload="metadata" tabindex="-1"></video>
  </div>
  <div class="campaign-content">
    <h1 id="campaign-brand" class="campaign-brand"><img class="campaign-brand-logo" data-campaign-logo alt=""><span data-campaign="brandName"></span></h1>
    <div class="campaign-stat campaign-stat--top" hidden></div>
    <p class="campaign-intro" data-campaign="intro"></p>
    <article class="campaign-card" aria-labelledby="campaign-title">
      <p class="campaign-badge" data-campaign="badge"></p>
      <h2 id="campaign-title"><img class="campaign-card-logo" data-campaign-logo alt=""><span data-campaign="title"></span></h2>
      <p class="campaign-subtitle" data-campaign="subtitle"></p>
      <p class="campaign-description" data-campaign="description"></p>
      <a class="campaign-cta" data-campaign-cta><span data-campaign="ctaText"></span><span aria-hidden="true">↗</span></a>
      <p class="campaign-missing-link" hidden>Chưa có liên kết: điền ctaHref trong campaign-config.js.</p>
    </article>
    <div class="campaign-stat campaign-stat--bottom" hidden></div>
    <p class="campaign-message" data-campaign="message"></p>
    <div class="campaign-bottom">
      <button class="campaign-video-toggle" type="button" aria-label="Tạm dừng video nền"><span class="campaign-video-icon" aria-hidden="true">Ⅱ</span><span class="campaign-video-label">Tạm dừng</span></button>
      <a class="campaign-scroll" href="#unveil" aria-label="Cuộn xuống banner mở bạt"><span>SCROLL</span><i aria-hidden="true"></i></a>
    </div>
  </div>
  <span class="campaign-video-status" role="status"></span>
  <noscript><p class="campaign-noscript">Bật JavaScript để xem video giới thiệu hoặc <a href="#unveil">đi tới phần tiếp theo</a>.</p></noscript>
</section>
